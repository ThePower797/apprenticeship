<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="flex-grid.css">
  <title>Flex-Grid - Lee's Apprenticeship Site</title>
</head>
<body>
<nav>
  <a class="nav-button" href="../index.html" tabindex="0">Home</a>
</nav>
<main>
  <h1>Flex-Grid</h1>
  <h2>Photo Library Grid</h2>
  <section class="search-bar">
    <input type="text" aria-label="Search game covers">
    <select id="Console" aria-label="Select a game console">
      <option value="all">All Consoles</option>
      <option value="gameboy">Gameboy</option>
      <option value="gameboy-color">Gameboy Color</option>
      <option value="gameboy-advance">Gameboy Advance</option>
    </select>
    <button type="submit">Search</button>
  </section>
  <section class="photo-library">
    <img src="img/pokemon-red.jpg" alt="Pokemon Red on Gameboy">
    <img src="img/pokemon-blue.jpg" alt="Pokemon Blue on Gameboy">
    <img src="img/pokemon-gold.jpg" alt="Pokemon Gold on Gameboy Colour">
    <img src="img/pokemon-silver.jpg" alt="Pokemon Silver on Gameboy Colour">
    <img src="img/pokemon-crystal.png" alt="Pokemon Crystal on Gameboy Colour">
    <img src="img/pokemon-fire-red.jpg" alt="Pokemon Fire Red on Gameboy Advance">
    <img src="img/pokemon-leaf-green.jpg" alt="Pokemon Leaf Green on Gameboy Advance">
    <img src="img/pokemon-ruby.jpg" alt="Pokemon Ruby on Gameboy Advance">
    <img src="img/pokemon-sapphire.jpg" alt="Pokemon Sapphire on Gameboy Advance">
    <img src="img/pokemon-emerald.jpg" alt="Pokemon Emerald on Gameboy Advance">
  </section>
</main>
<footer>
  <p>Table made with Grid in CSS and Search made with Flex</p>
</footer>
</body>
</html>
